name: Run tests

on:
  pull_request:
    branches:
      - main
    paths:
      - '**.py'
      - 'pyproject.toml'
      - '.github/workflows/**'

jobs:
  job_mytests:
    runs-on: ${{ matrix.os }}
    # 3.13 runs as an experimental cell (see the matrix): continue-on-error so a
    # 3.13-only breakage fails softly rather than failing the whole check. 3.13 CI
    # is green as of this PR; drop the experimental flag to make it a required cell.
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      # A failing supported cell cancels the rest (the ctdcast house style). The
      # 3.13 cell is continue-on-error, so it never triggers this cancellation.
      fail-fast: true
      matrix:
        # Ubuntu covers the full Python range; macOS and Windows run one version
        # only (they catch platform issues, not version issues). Coverage is gated
        # on the ubuntu-latest / 3.12 cell.
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
        include:
          - os: ubuntu-latest
            python-version: "3.13"
            experimental: true
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"

    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install amocatlas with test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Test with pytest
        # Coverage is measured on a single matrix cell (ubuntu / 3.12) so the
        # --cov-fail-under floor is compared against one platform's number, not
        # a mix; every other cell runs --no-cov. Raise the floor as coverage
        # grows; never lower it.
        run: |
          pytest -m "not slow" \
          ${{ (matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12') && '--cov=amocatlas --cov-report=term-missing --cov-fail-under=55' || '--no-cov' }}
