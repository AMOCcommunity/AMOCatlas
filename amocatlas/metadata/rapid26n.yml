metadata:
  program: RAPID
  description: "RAPID 26N transport estimates dataset"
  project: "RAPID-AMOC 26°N array"
  weblink: https://rapid.ac.uk/rapidmoc
  comment: Dataset accessed and processed via http://github.com/AMOCcommunity/amocatlas
  #acknowledgement: >
  #  The RAPID-MOC monitoring project is funded by the Natural Environment Research Council and data is freely available from www.rapid.ac.uk/
  license: >
    UK Open Government Licence v3.0 https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/
  Conventions: CF-1.8, ACDD-1.3
  time_coverage_start: "2004-04-01"
  time_coverage_end: "2024-03-27"
  date_created: 17-Sep-2024
  platform_type: Mooring array
  institution: National Oceanography Centre, UK
  doi: https://doi.org/10.5285/48d0bf43-0598-ceb2-e063-7086abc062f1
  product_version: "2024.1a"
  acknowledgment: >
    Data from the RAPID MOC monitoring project are funded by the Natural Environment Research Council, the National Science Foundation (NSF) with support from NOAA. They are freely available from www.rapid.ac.uk/.
  citation: >
    Moat B.I.; Smeed D.A.; Rayner D.; Johns W.E.; Smith, R.; Volkov, D.; Elipot S.; Petit T.; Kajtar J.; Baringer M. O.; and Collins, J. (2026). Atlantic meridional overturning circulation observed by the RAPID-MOCHA-WBTS (RAPID-Meridional Overturning Circulation and Heatflux Array-Western Boundary Time Series) array at 26N from 2004 to 2024 (v2024.1a), British Oceanographic Data Centre - Natural Environment Research Council, UK. doi: 10.5285/48d0bf43-0598-ceb2-e063-7086abc062f1
  distribution_statement: >
    Data from RAPID MOC monitoring project are made freely available to the public. Continued funding of this project depends on us being able to justify the usefulness of the data to the Natural Environment Research Council. The project scientists would appreciate it if you would use the data DOI (see "citation") and add the following acknowledgment (see "acknowledgment") to any publications that use this data.

files:
  moc_transports.nc:
    featureType: timeSeries
    data_product: "RAPID layer transport time series"
    variable_mapping:
      time: TIME
      t_therm10: TRANS_0_800
      t_aiw10: TRANS_800_1100
      t_ud10: TRANS_1100_3000
      t_ld10: TRANS_3000_5000
      t_bw10: TRANS_below_5000
      t_gs10: TRANS_FC
      t_ek10: TRANS_EKMAN
      t_umo10: TRANS_UMO
      moc_mar_hc10: MOC
    original_variable_metadata:
      t_therm10:
        long_name: "Transport (0-800m)"
        description: "Thermocline recirculation 0-800m"
        units: sverdrup
        standard_name: ocean_volume_transport_across_line
      t_aiw10:
        long_name: "Transport (800-1100m)"
        description: "Intermediate water 800-1100m"
        units: sverdrup
        standard_name: ocean_volume_transport_across_line
      t_ud10:
        long_name: "Transport (1100-3000m)"
        description: "upper NADW 1100-3000m"
        units: sverdrup
        standard_name: ocean_volume_transport_across_line
      t_ld10:
        long_name: "Transport (3000-5000m)"
        description: "lower NADW 3000-5000m"
        units: sverdrup
        standard_name: ocean_volume_transport_across_line
      t_bw10:
        long_name: "Transport (AABW)"
        description: "AABW > 5000m"
        units: sverdrup
        standard_name: ocean_volume_transport_across_line
      t_gs10:
        long_name: "Florida Current"
        description: "Florida Current from cable measurements"
        units: sverdrup
        standard_name: ocean_volume_transport_across_line
      t_ek10:
        long_name: "Ekman"
        description: "Ekman transport from wind stress"
        units: sverdrup
        standard_name: ocean_volume_transport_across_line
      t_umo10:
        long_name: "Upper mid-ocean"
        description: "Upper Mid-Ocean transport"
        units: sverdrup
        standard_name: ocean_volume_transport_across_line
      moc_mar_hc10:
        long_name: "MOC_z"
        description: "MOC strength"
        units: sverdrup
        standard_name: ocean_meridional_overturning_streamfunction
        cell_methods: "DEPTH: maximum"

  ts_gridded.nc:
    featureType: timeSeriesProfile
    data_product: "RAPID gridded temperature and salinity"
    source_file: ts_gridded.nc
    variable_mapping:
      time: TIME
      TG_west: TEMP_WEST
      TG_east: TEMP_EAST
      TG_marwest: TEMP_MARWEST
      TG_mareast: TEMP_MAREAST
      TG_wb3: TEMP_WB3
      SG_west: PSAL_WEST
      SG_east: PSAL_EAST
      SG_marwest: PSAL_MARWEST
      SG_mareast: PSAL_MAREAST
      SG_wb3: PSAL_WB3
      TG_west_flag: TEMP_WEST_FLAG
      TG_east_flag: TEMP_EAST_FLAG
      TG_marwest_flag: TEMP_MARWEST_FLAG
      TG_mareast_flag: TEMP_MAREAST_FLAG
      TG_wb3_flag: TEMP_WB3_FLAG
      SG_west_flag: PSAL_WEST_FLAG
      SG_east_flag: PSAL_EAST_FLAG
      SG_marwest_flag: PSAL_MARWEST_FLAG
      SG_mareast_flag: PSAL_MAREAST_FLAG
      SG_wb3_flag: PSAL_WB3_FLAG
      pressure: PRESSURE
    convert_to_coord: pressure
    original_variable_metadata:
      TG_west:
        long_name: "Temperature 26.52N/76.74W"
        units: degree_C
        standard_name: sea_water_temperature
      SG_west:
        long_name: "Salinity 26.52N/76.74W"
        units: 1
        standard_name: sea_water_practical_salinity
      TG_wb3:
        long_name: "Temperature WB3 26.50N/76.50W"
        units: degree_C
        standard_name: sea_water_temperature
      SG_wb3:
        long_name: "Salinity WB3 26.50N/76.50W"
        units: 1
        standard_name: sea_water_practical_salinity
      TG_east:
        long_name: "Temperature east 26.99N/16.23W"
        units: degree_C
        standard_name: sea_water_temperature
      SG_east:
        long_name: "Salinity east 26.99N/16.23W"
        units: 1
        standard_name: sea_water_practical_salinity
      TG_marwest:
        long_name: "Temperature MAR west 24.52N/50.57W"
        units: degree_C
        standard_name: sea_water_temperature
      SG_marwest:
        long_name: "Salinity MAR west 24.52N/50.57W"
        units: 1
        standard_name: sea_water_practical_salinity
      TG_mareast:
        long_name: "Temperature MAR east 24.52N/41.21W"
        units: degree_C
        standard_name: sea_water_temperature
      SG_mareast:
        long_name: "Salinity MAR east 24.52N/41.21W"
        units: 1
        standard_name: sea_water_practical_salinity

  moc_vertical.nc:
    featureType: timeSeriesProfile
    data_product: "RAPID vertical streamfunction time series"
    source_file: moc_vertical.nc
    variable_mapping:
      time: TIME
      depth: DEPTH
      stream_function_mar: PSI_Z
    original_variable_metadata:
      stream_function_mar:
        long_name: "Streamfunction"
        description: "Streamfunction across the Atlantic at 26.5°N"
        units: sverdrup
        standard_name: ocean_meridional_overturning_streamfunction

  2d_gridded.nc:
    featureType: timeSeriesProfile
    data_product: "RAPID 2D gridded data"
    source_file: 2d_gridded.nc
    variable_mapping: 
      time: TIME
      depth: DEPTH
      longitude: LONGITUDE
      pressure: PRESSURE
      area: AREA
      V_insitu: VCUR_INSITU
      V_ekman: VCUR_EKMAN
      V_net: VCUR_NET
    original_variable_metadata:
      pressure:
        long_name: "Pressure"
        description: "Sea water pressure at depth"
        units: dbar
        standard_name: sea_water_pressure
      area:
        long_name: "Grid cell area"
        description: "Area of each grid cell"
        units: m2
        standard_name: cell_area
      CT:
        long_name: "Conservative temperature"
        description: "Conservative temperature following TEOS-10 standard"
        units: degree_C
        standard_name: sea_water_conservative_temperature
      SA:
        long_name: "Salinity"
        description: "Absolute salinity following TEOS-10 standard"
        units: g kg-1
        standard_name: sea_water_absolute_salinity
      V_insitu:
        long_name: "Meridional velocity"
        description: "In-situ meridional velocity component"
        units: m s-1
        standard_name: northward_sea_water_velocity
      V_ekman:
        long_name: "Ekman velocity"
        description: "Ekman transport velocity component"
        units: m s-1
        standard_name: northward_sea_water_velocity
      V_net:
        long_name: "Net velocity"
        description: "Net meridional velocity (in-situ + Ekman)"
        units: m s-1
        standard_name: northward_sea_water_velocity
    coordinates:
      depth:
        long_name: "Depth"
        description: "Depth below sea surface"
        units: m
        standard_name: depth
      longitude:
        long_name: "Longitude"
        description: "Longitude coordinate"
        units: degree_east
        standard_name: longitude
      time:
        long_name: "Time"
        description: "Time coordinate"
        units: "days since 1950-01-01 00:00:00"
        standard_name: time

  meridional_transports.nc:
    featureType: timeSeriesProfile
    data_product: "RAPID meridional transport data"
    source_file: meridional_transports.nc
    variable_mapping: 
      time: TIME
      depth: DEPTH
      sigma0: SIGMA0
      sigma2: SIGMA2
      heat_trans: MHT
      frwa_trans: MFT
      pressure: PRESSURE
      amoc_depth: MOC
      amoc_sigma0: MOC_SIGMA0
      amoc_sigma2: MOC_SIGMA2
      stream_depth: PSI_Z
      stream_sigma0: PSI_SIGMA0
      stream_sigma2: PSI_SIGMA2
    original_variable_metadata:
      amoc_depth:
        long_name: "MOC_z"
        description: "Atlantic meridional overturning circulation strength in depth coordinates"
        units: sverdrup
        standard_name: ocean_meridional_overturning_streamfunction
        cell_methods: "DEPTH: maximum"
      amoc_sigma0:
        long_name: "MOC_sigma0"
        description: "Atlantic meridional overturning circulation strength in potential density (sigma0) coordinates"
        units: sverdrup
        reference_pressure: 0
        standard_name: ocean_meridional_overturning_streamfunction
        cell_methods: "SIGMA0: maximum"
      amoc_sigma2:
        long_name: "MOC_sigma2"
        description: "Atlantic meridional overturning circulation strength in potential density (sigma2) coordinates"
        units: sverdrup
        reference_pressure: 2000
        standard_name: ocean_meridional_overturning_streamfunction
        cell_methods: "SIGMA2: maximum"
      heat_trans:
        long_name: "Meridional heat transport"
        description: "Northward oceanic heat transport"
        units: PW
        standard_name: northward_ocean_heat_transport
      frwa_trans:
        long_name: "northward ocean freshwater transport"
        source_long_name: "Freshwater transport"
        description: "Meridional freshwater transport"
        units: sverdrup
      pressure:
        long_name: "Pressure"
        description: "Sea water pressure at depth"
        units: dbar
        standard_name: sea_water_pressure
      stream_depth:
        long_name: "Streamfunction"
        description: "Meridional overturning streamfunction in depth coordinates"
        units: sverdrup
        standard_name: ocean_meridional_overturning_streamfunction
      stream_sigma0:
        long_name: "Streamfunction"
        description: "Meridional overturning streamfunction in potential density (sigma0) coordinates"
        units: sverdrup
        reference_pressure: 0
        standard_name: ocean_meridional_overturning_streamfunction
      stream_sigma2:
        long_name: "Streamfunction"
        description: "Meridional overturning streamfunction in potential density (sigma2) coordinates"
        units: sverdrup
        reference_pressure: 2000
        standard_name: ocean_meridional_overturning_streamfunction
    coordinates:
      time:
        long_name: "Time"
        description: "Time coordinate"
        units: "days since 1950-01-01 00:00:00"
        standard_name: time
      depth:
        long_name: "Depth"
        description: "Depth below sea surface"
        units: m
        standard_name: depth
      sigma0:
        long_name: "sigma0"
        description: "Potential density anomaly referenced to surface (sigma-theta), density anomaly to 1000 kg/m3"
        units: kg m-3
        standard_name: sea_water_sigma_theta
      sigma2:
        long_name: "sigma2"
        description: "Potential density anomaly referenced to 2000m (sigma-2), density anomaly to 1000 kg/m3"
        units: kg m-3
        reference_pressure: 2000
        standard_name: sea_water_sigma_theta
