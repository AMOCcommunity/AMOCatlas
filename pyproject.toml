[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "setuptools>=45",
  "setuptools-scm[toml]>=8.0",
  "wheel",
]

[project]
name = "AMOCatlas"
description = "Python project to read data from arrays measuring the Atlantic meridional overturning circulation"
readme = "README.md"
license = { file = "LICENSE" }
maintainers = [
  { name = "Eleanor Frajka-Williams", email = "eleanorfrajka@gmail.com" },
  { name = "Isabelle Schmitz", email = "isabelle.schmitz@uni-hamburg.de" },
]
requires-python = ">=3.10"
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dynamic = [
  "version",
]
dependencies = [
  "numpy>=1.23",
  "pandas>=2.3.3",
  "xarray>=2025.6.1",
  "netcdf4>=1.7.4",
  "scipy>=1.15.3",
  "pyyaml>=6.0",
  "requests>=2.25.0",
  "jinja2>=3.1.6",
  "matplotlib>=3.10.9",
]
urls.documentation = "https://github.com/AMOCcommunity/AMOCatlas"
urls.homepage = "https://github.com/AMOCcommunity/AMOCatlas"
urls.repository = "https://github.com/AMOCcommunity/AMOCatlas"

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-cov>=7.1.0",
  "jsonschema>=4.0",        # validates metadata YAMLs and amocvocab.yml against their schemas
  "pyudunits2[xml]>=0.1",   # UDUNITS unit parsing/convertibility checks in validate_amocvocab (lazy import; dev/CI only)
]
docs = [
  "sphinx>=8.1.3",
  "sphinx-rtd-theme>=3.1.0",
  "myst-parser>=4.0.1",
  "nbsphinx>=0.9.8",
  "nbconvert>=7.17.1",
  "ipython>=8.0",           # provides the "ipython3" Pygments lexer nbsphinx uses for notebook cells
  "pypandoc>=1.17",         # needs the pandoc binary (apt-get in CI; conda-forge locally)
]
dev = [
  "amocatlas[test,docs]",
  "ruff>=0.3",
  "jupyterlab>=4.0",
  "pygmt>=0.13.0",          # publication figures only; lazy import in plotters, never runtime
]

[tool.setuptools]
packages = ["amocatlas", "amocatlas.metadata", "amocatlas.data_sources", "amocatlas.vocabulary"]
include-package-data = true

[tool.setuptools.package-data]
# vocabulary is listed explicitly (not globbed) so the working draft — amocvocab_draft.yml
# and amocvocab_draft.schema.json — is repo-tracked but NOT shipped in the wheel.
amocatlas = [
    "metadata/*.yml",
    "metadata/*.json",
    "vocabulary/amocvocab.yml",
    "vocabulary/amocvocab.schema.json",
    "vocabulary/cf_standard_names.json",
]

[tool.setuptools.dynamic]
readme = { file = "README.md", content-type = "text/markdown" }

[tool.setuptools_scm]
write_to = "amocatlas/_version.py"
write_to_template = "__version__ = '{version}'"
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"
tag_regex = "^v(?P<version>[0-9]+(?:\\.[0-9]+)*[a-z0-9]*)$"
# tag_regex = "^(?P<prefix>v)?(?P<version>[^\\+]+)(?P<suffix>.*)?$"

[tool.check-manifest]
ignore = [
  "docs",
  "docs/*",
  "notebooks",
  "notebooks/*",
  "tests",
  "tests/*",
]

[tool.ruff]
line-length = 88
target-version = "py310"
# ruff handles both linting (below) and formatting (ruff format), replacing black.

[tool.ruff.lint]
select = [
  "E", "F", "W",          # pycodestyle + pyflakes
  "B", "BLE",             # bugbear, blind-except
  "ARG",                  # unused arguments
  "D", "ANN",             # docstrings (numpy convention) + annotations
  "I",                    # import sorting
  "UP",                   # pyupgrade — modern syntax
  "C4",                   # comprehensions
  "RET",                  # return-statement hygiene
  "PIE", "SIM",           # misc lint + simplifications
  "NPY",                  # numpy-specific
  "RUF100",               # unused noqa
]
ignore = [
  "E501",   # line too long — formatter handles this
  "C901",   # complexity
  # Pre-existing docstring-mood/format debt, surfaced when these were un-ignored on
  # 2026-09-08 (D401: 11, D205: 9, D400: 1). Burn down incrementally, then drop these.
  "D401",   # first line should be in imperative mood
  "D205",   # 1 blank line required between summary line and description
  "D400",   # first line should end with a period
  "SIM108", # if/else vs ternary is a case-by-case readability call, not a rule (7 hits, 2026-09-08)
  # Adopt-incrementally: safe to fix but touch multi-line/nested blocks; deferred to a
  # focused burn-down rather than a rushed inline (RET504: 8, SIM102: 4; 2026-09-08).
  "RET504", # unnecessary assignment before return
  "SIM102", # collapsible nested if
]
# D417 (undocumented-param) is switched off by the numpy convention below; it is the
# only check that enforces the "numpy sections with full type information" half of the
# convention, so put it back. (PTH — pathlib over os.path/open — is the one ctdcast
# rule not yet adopted here: it is a manual migration, tracked on the backlog.)
extend-select = ["D417"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# tests are not public API: no docstring rules (D), no annotations (ANN), no unused-argument
# rule (pytest fixtures and mock stubs look unused); allow late imports and private access.
"tests/*" = ["E402", "SLF001", "ANN", "D", "ARG", "NPY002", "BLE001", "SIM", "RET504", "C4"]  # tests are not public API: allow legacy np.random in synthetic fixtures, blind except, and style-only simplifications
"notebooks/*" = ["ANN", "F821"]  # Example notebooks: type annotations not expected; cross-cell names ruff cannot resolve per-cell
"amocatlas/logger.py" = ["ANN401"]  # Allow Any type for *args in logging functions (standard pattern)
"amocatlas/report.py" = ["BLE001"]  # Allow broad exception handling in plot generation where many failure modes exist

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
